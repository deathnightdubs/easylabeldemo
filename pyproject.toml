[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numis"
version = "0.1.0.dev0"
description = "Numismatic collection manager"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
# The interface. The core library deliberately works without it, so a headless install can
# still import numis, run the CLI and run most of the tests.
gui = ["PySide6-Essentials>=6.7"]
dev = [
    "pytest>=8",
    "ruff",
    "PySide6-Essentials>=6.7",
]

[project.scripts]
numis = "numis.cli:main"

[project.gui-scripts]
numis-gui = "numis.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Qt must be configured for a headless platform before it is imported, so the imports in the
# interface test fixtures cannot all sit at the top of the file.
"tests/ui/conftest.py" = ["E402"]
